[project]
name = "mcp-xss-hunter"
version = "0.1.0"
description = "Context-aware XSS hunter with browser-verified execution, exposed over MCP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.64.1",
]

[project.scripts]
xss-hunter = "xss_hunter.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xss_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
